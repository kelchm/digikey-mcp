name: docker-publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:  # allow manual runs for testing the workflow itself

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package + pytest
        run: |
          pip install . pytest
      - name: Run offline test suite
        run: pytest -q

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3  # arm64 emulation for cross-build
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/digikey-mcp
          # On a v1.2.3 push: produces 1.2.3, 1.2, latest. Major-only ("1") is
          # intentionally omitted — pre-1.0 we don't want a bare `1` floating tag,
          # and post-1.0 it's still a footgun for callers pinning loosely.
          # `latest` is gated on push events so a workflow_dispatch diagnostic
          # run (which has no semver tag context) can't silently retarget it.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # Tag pushes publish; workflow_dispatch builds (cross-arch sanity
          # check) without publishing, so we don't pollute GHCR with manual
          # runs and don't trip build-push-action's empty-tags error path.
          push: ${{ github.event_name == 'push' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
