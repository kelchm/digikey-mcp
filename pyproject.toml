[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "digikey-mcp"
version = "0.1.0"
description = "DigiKey MCP Server for product search"
dependencies = [
    "fastmcp",
    "requests",
    "python-dotenv",
]
requires-python = ">=3.10"

[project.scripts]
digikey-mcp = "digikey_mcp_server:main"

[tool.setuptools]
py-modules = ["digikey_mcp_server"]
