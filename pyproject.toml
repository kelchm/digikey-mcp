[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "digikey-mcp"
version = "0.1.0"
description = "DigiKey MCP Server for product search"
dependencies = [
    "fastmcp",
    "requests",
    "python-dotenv",
    "pint",
]
requires-python = ">=3.10"

[project.scripts]
digikey-mcp = "digikey_mcp_server:main"
digikey-mcp-auth = "digikey_mcp_auth:main"

[tool.setuptools]
py-modules = ["digikey_mcp_server", "digikey_mcp_auth"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
